# InsightPilot V2 P3.5b: rootless CI image build and benchmark on the GitHub-hosted ubuntu-24.04 runner.
#
# History:
# - Run 1 (45001295990, 2f3e1fbb): the enforcement probe was refused only for
#   Podman-injected /etc/passwd and /etc/group bind mounts.
# - Run 2 (45002558309, 98e29c04): with --passwd=false (approved), all three
#   gates passed.
# - Run 3 (45031896461, 83596758): every stage passed except the golden charts.
#   The 7 chart hashes differed because the P3.5a references were rendered with
#   the development host's MATPLOTLIBRC and system fonts
#   (docs/v2/P3_CHART_REFERENCE_INVESTIGATION.md). Correction (approved): exact
#   comparison against the hermetic chart_hermetic references, plus a
#   mandatory render-environment check. Original references preserved.
# - Run 4 (45033387515, 4cd107e0): every stage passed, for the inert image (functional evidence;
#   root-equivalent runner, not VE-2). Sanitized evidence: docs/v2/p3/ci_run4/ (P3.6-0).
# - P3.6-4B revision (approved): builds and verifies the P3.6 supervisor image, then runs the REAL
#   ContainerRuntime (Phase F) on committed, hash-pinned fixtures only. It runs only on a push to
#   feature/v2-p364b-real-container-validation that changes this file, only in this repository, and
#   only when the reviewed content digest below matches the pushed commit (everything except .github/
#   and docs/). Phase F enters hardened mode solely through bootstrap.install_for_validation().
# - Runs 5 (45121353914) and 6 (45122041350): Stage 1 passed; the real runtime failed closed because
#   Podman 4.9.3 refuses --dns=none with --network=none. D1 (approved) removed --dns=none; the push
#   that adds this comment is the single authorized D1 validation attempt (code digest of d7a5dea2).
# - Run 7 (45125846903): DNS conflict gone; refused on tmpfs nr_inodes. D3 (approved) removed nr_inodes
#   (inode-count limits no longer enforced); a create-only argument-compatibility diagnostic was added.
#   The push that adds this line is the single authorized D3 validation attempt (code digest of 4b7f7244).
# - Run 8 (45341414519): the container started; attestation refused only on writable_mounts. D2 (approved,
#   Option A): exact rootless set. The push that adds this line is the single authorized D2 attempt (b1723129).
# This revision (approved) adds, each step only after the previous one passed:
# - Phase C: verified wheels, offline rootless build, full image verification;
# - Phase D: a clean second build and an image/layer comparison;
# - Phase E: warm/cold start-up, the hash-pinned golden fixtures in the image,
#   and the OS package inventory.
#
# Safety:
# - every container and build goes through scripts/p3/rootless.py (rootless
#   Podman, --passwd=false, --network=none, read-only root, cap-drop ALL,
#   no-new-privileges, seccomp, uid/gid 10001, cgroup limits);
# - direct podman use here is limited to --version, run --help, tag and rmi;
# - no rootful Docker or Podman, no secrets, no third-party actions, no
#   generated or user code, no vulnerability scan;
# - the only privileged action is the marked enable-linger step; `sudo -n true`
#   is a no-op check whose result the report records;
# - gates 2 and 3 stop the job on failure.

name: p3-ubuntu-rootless-probe

on:
  push:
    branches: [feature/v2-p364b-real-container-validation]
    paths: [.github/workflows/p3-ubuntu-rootless-probe.yml]

permissions:
  contents: read

concurrency:
  group: p3-ubuntu-rootless-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'push' && github.repository == 'shashwatsharma028-sys/insight-pilot' && github.ref == 'refs/heads/feature/v2-p364b-real-container-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Fetch the exact pushed commit (read-only token, this step only, no third-party action)
        timeout-minutes: 3
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          mkdir -p "$P3_OUT"
          git init -q "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" fetch -q --depth 1 origin "$GITHUB_SHA"
          unset AUTH
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "commit: $(git rev-parse HEAD)" | tee "$P3_OUT/commit.txt"

      - name: Approved-content gate - the pushed code is exactly the reviewed P3.6-4B content (stops the job on failure)
        timeout-minutes: 2
        working-directory: src
        run: |
          set -euo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          APPROVED="00d73dc541359fd0a56bb11d2b345325c6f99d44b16ac17bff59246e55f7b1b7"
          GOT="$(git ls-tree HEAD | grep -v -P '\t(\.github|docs)$' | sha256sum | cut -d' ' -f1)"
          echo "approved content digest: $APPROVED"; echo "pushed content digest:   $GOT"
          rc=0; [ "$GOT" = "$APPROVED" ] || rc=5
          echo "$rc" > "$P3_OUT/content.rc"; exit "$rc"

      - name: Record runner specifications (read-only)
        timeout-minutes: 2
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"; mkdir -p "$P3_OUT"
          {
            echo "== os-release"; grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            echo "== kernel"; uname -srvm
            echo "== cpu"; nproc; grep -m1 'model name' /proc/cpuinfo || true
            echo "== memory"; free -b | head -2
            echo "== disk"; df -B1 --output=target,size,avail / | tail -1
            echo "== identity"; id
            echo "== passwordless sudo"; sudo -n true 2>/dev/null && echo yes || echo no
            echo "== cgroup fs"; stat -fc %T /sys/fs/cgroup
            echo "== podman"; podman --version
          } 2>&1 | tee "$P3_OUT/specs.txt"

      - name: Gate 1 - host facts as provided (informational)
        timeout-minutes: 3
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py check-host > "$P3_OUT/gate1.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/gate1.rc"; cat "$P3_OUT/gate1.txt"; echo "gate1 exit=$rc"

      - name: TEMPORARY VM ADMINISTRATION (sudo) - start a systemd user manager for the runner account
        timeout-minutes: 3
        run: |
          set -uo pipefail
          # The only privileged step (as in the VE-2 guide). It starts no container.
          sudo loginctl enable-linger "$(id -un)"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Gate 2 - host facts with a user manager (stops the job on failure)
        timeout-minutes: 3
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py check-host > "$P3_OUT/gate2.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/gate2.rc"; cat "$P3_OUT/gate2.txt"; exit "$rc"

      - name: Gate 3 - enforcement probe on the digest-pinned base (stops the job on failure)
        timeout-minutes: 8
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          podman run --help 2>&1 | grep -E -- '--passwd ' || { echo "podman lacks --passwd"; echo 3 > "$P3_OUT/gate3.rc"; exit 3; }
          rc=0; python3 -I -B scripts/p3/rootless.py check-host --probe --evidence "$P3_OUT/probe.json" > "$P3_OUT/gate3.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/gate3.rc"; tail -n 5 "$P3_OUT/gate3.txt"
          [ -s "$P3_OUT/probe.json" ] && cat "$P3_OUT/probe.json"
          exit "$rc"

      - name: Phase C - fetch the SHA-256-verified wheel cache (native architecture)
        timeout-minutes: 5
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/image_tool.py fetch-wheels --arch "$(uname -m)" --cache "$RUNNER_TEMP/wheels" > "$P3_OUT/wheels.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/wheels.rc"; cat "$P3_OUT/wheels.txt"; du -sb "$RUNNER_TEMP/wheels"; exit "$rc"

      - name: Phase C - build 1 (rootless builder, offline, digest-pinned base)
        timeout-minutes: 20
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py build --wheel-cache "$RUNNER_TEMP/wheels" --evidence "$P3_OUT/build1.json" > "$P3_OUT/build1.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/build1.rc"; tail -n 60 "$P3_OUT/build1.txt"; exit "$rc"

      - name: Phase C - verify build 1 (config, contents, runtime enforcement, inert entrypoint)
        timeout-minutes: 8
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          TAG="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$P3_OUT/build1.json")"
          rc=0; python3 -I -B scripts/p3/rootless.py verify "$TAG" --evidence "$P3_OUT/verify1.json" > "$P3_OUT/verify1.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/verify1.rc"; tail -n 40 "$P3_OUT/verify1.txt"; exit "$rc"

      - name: Phase D - clean build 2 with identical verified inputs
        timeout-minutes: 20
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          TAG="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$P3_OUT/build1.json")"
          podman tag "$TAG" localhost/ip-build1 && podman rmi "$TAG"
          rc=0; python3 -I -B scripts/p3/rootless.py build --wheel-cache "$RUNNER_TEMP/wheels" --evidence "$P3_OUT/build2.json" > "$P3_OUT/build2.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/build2.rc"; tail -n 20 "$P3_OUT/build2.txt"; exit "$rc"

      - name: Phase D - compare build 1 and build 2 (IDs, digests, layers; member diff if they differ)
        timeout-minutes: 15
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          TAG="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$P3_OUT/build2.json")"
          rc=0; python3 -I -B scripts/p3/rootless.py compare localhost/ip-build1 "$TAG" --evidence "$P3_OUT/compare.json" > "$P3_OUT/compare.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/compare.rc"; cat "$P3_OUT/compare.txt"
          podman rmi "$TAG"
          exit "$rc"

      - name: Phase E - start-up benchmark of verified build 1 (warm 30, cold 10)
        timeout-minutes: 15
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py measure-startup localhost/ip-build1 --warm 30 --cold 10 --evidence "$P3_OUT/startup.json" > "$P3_OUT/startup.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/startup.rc"; cat "$P3_OUT/startup.txt"; exit "$rc"

      - name: Phase E - hash-pinned golden fixtures inside verified build 1 (numbers, exact hermetic charts, render environment)
        timeout-minutes: 15
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py golden localhost/ip-build1 --evidence "$P3_OUT/golden.json" > "$P3_OUT/golden.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/golden.rc"; cat "$P3_OUT/golden.txt"; exit "$rc"

      - name: Phase E - OS package inventory of verified build 1
        timeout-minutes: 5
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0; python3 -I -B scripts/p3/rootless.py os-packages localhost/ip-build1 --evidence "$P3_OUT/ospkgs.json" > "$P3_OUT/ospkgs.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/ospkgs.rc"
          python3 -I -c 'import json,sys; [print(p["name"], p["version"], p["arch"]) for p in json.load(open(sys.argv[1]))["packages"]]' "$P3_OUT/ospkgs.json" || cat "$P3_OUT/ospkgs.txt"
          exit "$rc"

      - name: Phase F - host test environment (runner Python, requirements-v2.txt; pip freeze recorded)
        timeout-minutes: 12
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          rc=0
          { python3 -m venv "$RUNNER_TEMP/hostenv" \
            && "$RUNNER_TEMP/hostenv/bin/pip" install -q --disable-pip-version-check -r requirements-v2.txt pytest==9.1.1 pyyaml==6.0.3 \
            && "$RUNNER_TEMP/hostenv/bin/pip" freeze --all > "$P3_OUT/hostenv-freeze.txt"; } > "$P3_OUT/hostenv.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/hostenv.rc"
          "$RUNNER_TEMP/hostenv/bin/python" -VV || true
          cat "$P3_OUT/hostenv-freeze.txt" 2>/dev/null || tail -n 40 "$P3_OUT/hostenv.txt"
          exit "$rc"

      - name: Phase F - Podman argument compatibility diagnostic on verified build 1 (create only, never started; recorded, does not stop the job)
        timeout-minutes: 8
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          IMAGE="sha256:$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_id"].split(":")[-1])' "$P3_OUT/build1.json")"
          rc=0; python3 -I -B scripts/p3/argv_compat.py --image "$IMAGE" --evidence "$P3_OUT/compat.json" > "$P3_OUT/compat.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/compat.rc"
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print("full_ok", d["full_ok"], {m: v["error"] for m, v in d["full"].items() if not v["ok"]}); print("run_only", d["run_only"]); print("rejected_alone", {k: d["add_one"].get(k, {}).get("error") for k in d["rejected_alone"]}); print("passes_when_removed", d["passes_when_removed"])' "$P3_OUT/compat.json" || tail -n 40 "$P3_OUT/compat.txt"
          echo "compat exit=$rc (recorded in the report)"

      - name: Phase F - real ContainerRuntime on verified build 1 (preflight, isolation observations, fail-closed, golden numbers and hermetic charts)
        timeout-minutes: 20
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          IMAGE="sha256:$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_id"].split(":")[-1])' "$P3_OUT/build1.json")"
          rc=0; IP_TEST_REQUIRE_CONTAINER=1 IP_TEST_CONTAINER_IMAGE="$IMAGE" IP_TEST_EVIDENCE_DIR="$P3_OUT" IP_TEST_EVIDENCE_NAME=runtime \
            PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/hostenv/bin/python" -m pytest -q -p no:cacheprovider -rA \
            tests/container/p364b/container_p364b.py -k "not test_11_p5_suite" > "$P3_OUT/runtime.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/runtime.rc"
          grep -E "^(PASSED|FAILED|ERROR|SKIPPED)|passed|failed|error" "$P3_OUT/runtime.txt" | tail -n 60
          [ "$rc" = 0 ] || tail -n 150 "$P3_OUT/runtime.txt"
          cat "$P3_OUT/runtime_runtime.json" 2>/dev/null || echo "no runtime evidence written"
          exit "$rc"

      - name: Phase F - P5 20-case suite through the real container port (V1 prelude)
        timeout-minutes: 20
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          IMAGE="sha256:$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_id"].split(":")[-1])' "$P3_OUT/build1.json")"
          rc=0; IP_TEST_REQUIRE_CONTAINER=1 IP_TEST_CONTAINER_IMAGE="$IMAGE" IP_TEST_EVIDENCE_DIR="$P3_OUT" IP_TEST_EVIDENCE_NAME=p5_v1 \
            PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/hostenv/bin/python" -m pytest -q -p no:cacheprovider -rA \
            tests/container/p364b/container_p364b.py -k "test_11_p5_suite and v1 or test_99" > "$P3_OUT/p5_v1.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/p5_v1.rc"
          grep -E "^(PASSED|FAILED|ERROR|SKIPPED)|passed|failed|error" "$P3_OUT/p5_v1.txt" | tail -n 30
          [ "$rc" = 0 ] || tail -n 120 "$P3_OUT/p5_v1.txt"
          cat "$P3_OUT/runtime_p5_v1.json" 2>/dev/null || echo "no p5 evidence written"
          exit "$rc"

      - name: Phase F - P5 20-case suite through the real container port (lazy-seaborn prelude)
        timeout-minutes: 20
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"
          IMAGE="sha256:$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_id"].split(":")[-1])' "$P3_OUT/build1.json")"
          rc=0; IP_TEST_REQUIRE_CONTAINER=1 IP_TEST_CONTAINER_IMAGE="$IMAGE" IP_TEST_EVIDENCE_DIR="$P3_OUT" IP_TEST_EVIDENCE_NAME=p5_lazy \
            PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/hostenv/bin/python" -m pytest -q -p no:cacheprovider -rA \
            tests/container/p364b/container_p364b.py -k "test_11_p5_suite and lazy or test_99" > "$P3_OUT/p5_lazy.txt" 2>&1 || rc=$?
          echo "$rc" > "$P3_OUT/p5_lazy.rc"
          grep -E "^(PASSED|FAILED|ERROR|SKIPPED)|passed|failed|error" "$P3_OUT/p5_lazy.txt" | tail -n 30
          [ "$rc" = 0 ] || tail -n 120 "$P3_OUT/p5_lazy.txt"
          cat "$P3_OUT/runtime_p5_lazy.json" 2>/dev/null || echo "no p5 evidence written"
          exit "$rc"

      - name: Readiness tests, including the workflow-policy test (must run, never skip)
        if: always()
        timeout-minutes: 8
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"; mkdir -p "$P3_OUT"
          rc=0
          { python3 -m venv "$RUNNER_TEMP/venv" \
            && "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3 \
            && PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/venv/bin/python" -m pytest --noconftest -q -p no:cacheprovider -rsA \
               tests/v2/p3/test_rootless_p35b.py tests/v2/p3/test_image_p35a.py \
               tests/v2/p36/test_container_suite_static_p364b.py; } > "$P3_OUT/tests.txt" 2>&1 || rc=$?
          grep -q "^PASSED tests/v2/p3/test_image_p35a.py::test_no_ci_workflow_except_the_approved_probe" "$P3_OUT/tests.txt" \
            || { echo "workflow-policy test did not PASS"; [ "$rc" = 0 ] && rc=4; }
          echo "$rc" > "$P3_OUT/tests.rc"
          grep -E "^(SKIPPED|FAILED|ERROR)|^PASSED tests/v2/p3/test_image_p35a.py::test_no_ci_workflow|passed|failed" "$P3_OUT/tests.txt" | tail -n 30
          exit "$rc"

      - name: Evidence report (fails the job unless every stage passed)
        if: always()
        timeout-minutes: 2
        working-directory: src
        run: |
          set -uo pipefail
          P3_OUT="$RUNNER_TEMP/p3"; mkdir -p "$P3_OUT"
          rc=0; python3 -I -B scripts/p3/ci_report.py "$P3_OUT" > "$P3_OUT/report.md" || rc=$?
          cat "$P3_OUT/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
